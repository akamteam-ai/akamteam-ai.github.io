<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akam — Practical AI solutions</title>
  <meta name="description" content="Akam is an AI services company building identity-verification (KYC) systems — document OCR, face matching, liveness and anti-spoofing — and applied machine learning." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Akam — Practical AI solutions" />
  <meta property="og:description" content="Identity verification and applied machine learning, from data to deployment." />
  <!-- Open Graph scrapers need absolute URLs; update the host once the site
       is published (see README.md → Publishing). -->
  <meta property="og:url" content="https://akamteam-ai.github.io/" />
  <meta property="og:image" content="https://akamteam-ai.github.io/assets/img/og-image.jpg" />

  <link rel="icon" href="assets/img/akam-emblem.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<a class="skip-link" href="#main" data-t="ui.skip">Skip to content</a>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="nav-brand" href="#top">
      <img class="nav-mark" src="assets/img/akam-emblem.jpg" alt="" width="32" height="32" />
      <span class="nav-name" data-t="company.name">Akam</span>
    </a>

    <nav class="nav-links" id="navLinks" aria-label="Sections">
      <a href="#services" data-t="ui.nav.services">Services</a>
      <a href="#team"     data-t="ui.nav.team">Team</a>
      <a href="#projects" data-t="ui.nav.projects">Projects</a>
      <a href="#kaggle"   data-t="ui.nav.kaggle">Kaggle</a>
      <a href="#contact"  data-t="ui.nav.contact">Contact</a>
    </nav>

    <div class="nav-tools">
      <button class="lang-toggle" id="langToggle" type="button"></button>

      <button class="theme-toggle" id="themeToggle" type="button">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ───────────────────────────  hero  ─────────────────────────── -->
  <section class="hero" id="top">
    <div class="hero-grid" aria-hidden="true"></div>
    <div class="wrap hero-inner">
      <div class="hero-text">
        <p class="eyebrow"><span class="dot"></span> <span data-t="ui.hero.badge"></span></p>
        <h1 data-t="company.tagline"></h1>
        <p class="hero-tagline" data-t="company.lead"></p>

        <div class="hero-actions" id="heroLinks"></div>

        <dl class="stat-row" id="heroStats"></dl>
      </div>

      <div class="hero-mark">
        <div class="mark-frame">
          <img id="wordmark" src="assets/img/akam-wordmark.jpg" alt="AKAM.ai" width="960" height="488" />
        </div>
        <div class="mark-glow" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- ───────────────────────────  about  ─────────────────────────── -->
  <section class="section" id="about">
    <div class="wrap about-grid">
      <div>
        <p class="section-kicker" data-t="ui.sections.about.kicker"></p>
        <h2 class="section-title" data-t="company.aboutTitle"></h2>
      </div>
      <div class="about-body" id="aboutBody"></div>
    </div>
    <figure class="wrap team-figure">
      <div class="team-panel">
        <div class="hero-grid" aria-hidden="true"></div>
        <figcaption class="team-panel-head">
          <img src="assets/img/akam-emblem.jpg" alt="" width="56" height="56" />
          <span><b data-t="company.legalName"></b><small data-t="ui.team.panelLabel"></small></span>
        </figcaption>
        <div class="team-portraits" id="teamPortraits"></div>
      </div>
    </figure>
  </section>

  <!-- ──────────────────────────  services  ───────────────────────── -->
  <section class="section section-alt" id="services">
    <div class="wrap">
      <p class="section-kicker" data-t="ui.sections.services.kicker"></p>
      <h2 class="section-title" data-t="ui.sections.services.title"></h2>
      <p class="section-lead" data-t="ui.sections.services.lead"></p>

      <div class="service-grid" id="serviceGrid"></div>

      <h3 class="col-title beyond-title" data-t="ui.sections.services.beyond"></h3>
      <div class="beyond-grid" id="beyondGrid"></div>
    </div>
  </section>

  <!-- ────────────────────────────  team  ─────────────────────────── -->
  <section class="section" id="team">
    <div class="wrap">
      <p class="section-kicker" data-t="ui.sections.team.kicker"></p>
      <h2 class="section-title" data-t="ui.sections.team.title"></h2>
      <div class="team-grid" id="teamGrid"></div>
    </div>
  </section>

  <!-- ──────────────────────────  projects  ───────────────────────── -->
  <section class="section section-alt" id="projects">
    <div class="wrap">
      <p class="section-kicker" data-t="ui.sections.projects.kicker"></p>
      <h2 class="section-title" data-t="ui.sections.projects.title"></h2>
      <p class="section-lead" data-t="ui.sections.projects.lead"></p>

      <div class="filter-block">
        <span class="filter-label" data-t="ui.projects.byMember"></span>
        <div class="filters" id="memberFilters" role="group"></div>
      </div>
      <div class="filter-block">
        <span class="filter-label" data-t="ui.projects.byTopic"></span>
        <div class="filters" id="topicFilters" role="group"></div>
      </div>

      <div class="project-grid" id="projectGrid"></div>
      <p class="empty-note" id="emptyNote" data-t="ui.projects.empty" hidden></p>
    </div>
  </section>

  <!-- ───────────────────────────  kaggle  ────────────────────────── -->
  <section class="section" id="kaggle">
    <div class="wrap">
      <p class="section-kicker" data-t="ui.sections.kaggle.kicker"></p>
      <h2 class="section-title" data-t="ui.sections.kaggle.title"></h2>
      <p class="section-lead" data-t="ui.sections.kaggle.lead"></p>
      <div class="kaggle-grid" id="kaggleGrid"></div>
    </div>
  </section>

  <!-- ──────────────────────────  contact  ────────────────────────── -->
  <section class="section section-alt" id="contact">
    <div class="wrap contact-inner">
      <p class="section-kicker" data-t="ui.sections.contact.kicker"></p>
      <h2 class="section-title" data-t="ui.sections.contact.title"></h2>
      <p class="section-lead" data-t="ui.sections.contact.lead"></p>
      <div class="hero-actions" id="contactLinks"></div>
      <p class="contact-email" id="contactEmail"></p>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <p>© <span id="year"></span> <span data-t="company.legalName"></span></p>
    <p class="footer-meta" data-t="ui.footer.meta"></p>
  </div>
</footer>

<script src="data/site.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
